name: Pull Request Checks

run-name: "Validate PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

env:
  NODE_VERSION: 24

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional PR title
    if: github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate conventional title for squash into develop
        id: title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Match the Conventional Commits header accepted by the release parser.
          pattern='^[a-zA-Z][a-zA-Z0-9-]*(\([^()]+\))?!?:[[:blank:]]+[^[:space:]].*$'
          if [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* || ! "$PR_TITLE" =~ $pattern ]]; then
            echo 'The PR title must use Conventional Commits: feat(kana): add new kana' >&2
            exit 1
          fi

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome checks
        run: pnpm run lint

      - name: Run Astro diagnostics
        run: pnpm exec astro check

  test:
    name: Unit tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    needs: [quality, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm exec astro build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: production-build-pr-${{ github.event.pull_request.number }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
