name: Update CONTRIBUTORS

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar CONTRIBUTORS.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Contribuidores"
            echo ""
            echo "Gracias a todas las personas que han contribuido a KiraKana:"
            echo ""
            echo "<table>"
            gh api "repos/${{ github.repository }}/contributors?per_page=100" \
              --jq '.[] | "<tr><td><a href=\"https://github.com/\(.login)\"><img src=\"\(.avatar_url)\" width=\"32\" height=\"32\" alt=\"\(.login)\" style=\"vertical-align:middle;\" /> \(.login)</a></td></tr>"'
            echo "</table>"
          } > CONTRIBUTORS.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md
          git diff --cached --quiet || git commit -m "docs: update CONTRIBUTORS.md [skip ci]"
          git push
