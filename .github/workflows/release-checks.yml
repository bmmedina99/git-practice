name: Release checks

on:
  pull_request:
    branches: [develop, production]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release tooling
        run: node --test scripts/release/*.test.mjs

      - name: Validate conventional title for squash into develop
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          import { parseConventionalCommit } from './scripts/release/core.mjs';
          if (!parseConventionalCommit(process.env.PR_TITLE)) {
            console.error('El título del PR debe usar Conventional Commits: feat(kana): add new kana');
            process.exitCode = 1;
          }
          NODE
