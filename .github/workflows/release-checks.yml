name: Release checks

on:
  pull_request:
    branches: [develop, production]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install release development tools
        run: pnpm install --frozen-lockfile
      - name: Check release types
        run: pnpm run typecheck:release
      - name: Test release tooling
        run: pnpm run test:release
